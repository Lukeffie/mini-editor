[package]
name = "mini-editor"
version = "1.0.0"
description = "极简 TXT/MD/HTML 预览编辑器"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }

[features]
# 生产构建时使用，关闭 devUrl 仅以 frontendDist 作为内容来源
custom-protocol = ["tauri/custom-protocol"]
